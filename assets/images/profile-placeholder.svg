<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c2027"/>
      <stop offset="70%" stop-color="#0c0e11"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DFF9A"/>
      <stop offset="100%" stop-color="#2D7BFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg-grad)"/>

  <!-- Subtle Cybernetic Grid -->
  <path d="M0 100 H400 M0 200 H400 M0 300 H400 M0 400 H400" stroke="#14171c" stroke-width="1"/>
  <path d="M100 0 V500 M200 0 V500 M300 0 V500" stroke="#14171c" stroke-width="1"/>

  <!-- Concentric Biometric Circles -->
  <circle cx="200" cy="210" r="130" stroke="#1c2027" stroke-width="2"/>
  <circle cx="200" cy="210" r="105" stroke="#3DFF9A" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Developer Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="170" r="50" fill="#14171c" stroke="url(#neon-grad)" stroke-width="3"/>
  <!-- Torso -->
  <path d="M110 330 C110 260 145 235 200 235 C255 235 290 260 290 330" fill="#14171c" stroke="url(#neon-grad)" stroke-width="3"/>

  <!-- Code Matrix Glyph in Center -->
  <circle cx="200" cy="170" r="12" fill="#050607" stroke="#3DFF9A" stroke-width="2"/>
  <text x="195" y="174" fill="#3DFF9A" font-family="monospace" font-size="12" font-weight="bold">01</text>

  <!-- Labels -->
  <text x="200" y="380" fill="#F4F6F8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">GANESH S</text>
  <text x="200" y="405" fill="#3DFF9A" font-family="monospace" font-size="12" letter-spacing="3" text-anchor="middle">// CS_DEVELOPER</text>
  <text x="200" y="450" fill="#666" font-family="monospace" font-size="10" text-anchor="middle">REPLACE WITH assets/images/profile.jpg</text>
</svg>
