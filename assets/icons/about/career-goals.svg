<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Career Goals &amp; Engineering Trajectory Icon">
  <defs>
    <!-- Fuselage metallic gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <!-- Nose cone dark metallic -->
    <linearGradient id="noseCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DFF9A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Fin gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DFF9A" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <!-- Flame plume gradient -->
    <linearGradient id="flameCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#3DFF9A" />
      <stop offset="75%" stop-color="#2D7BFF" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <!-- Porthole glass gradient -->
    <radialGradient id="portholeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#082F49" />
    </radialGradient>
    <!-- Thrust glow filter -->
    <filter id="thrustGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-1" dy="2" stdDeviation="3" flood-color="#3DFF9A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Propulsion Exhaust Flame Plume (Angled down-left) -->
  <g filter="url(#thrustGlow)">
    <!-- Outer plume -->
    <path d="M19 45 C14 50, 7 57, 5 61 C9 59, 16 52, 21 47 Z" fill="url(#flameCore)" opacity="0.8"/>
    <!-- Central fierce flame -->
    <path d="M20 44 C16 48, 11 54, 9 58 C12 55, 18 50, 22 46 Z" fill="#3DFF9A"/>
    <!-- Inner white flame core -->
    <path d="M21 43 C18 46, 14 50, 12 53 C14 51, 19 47, 22 45 Z" fill="#FFFFFF"/>
  </g>

  <!-- Exhaust Engine Nozzle Ring -->
  <path d="M18 42 L24 48 L22 50 L16 44 Z" fill="#334155" stroke="#3DFF9A" stroke-width="0.8"/>

  <!-- Left Delta Wing Fin -->
  <path d="M22 36 L13 42 C12 45, 14 47, 18 46 L24 44 Z" fill="url(#finGrad)"/>
  <!-- Right Delta Wing Fin -->
  <path d="M30 28 L36 21 C39 21, 41 23, 40 27 L38 34 Z" fill="url(#finGrad)"/>
  <!-- Center Dorsal Fin -->
  <path d="M26 34 L32 40 L30 42 L24 36 Z" fill="#1E293B"/>

  <!-- Main Fuselage Streamlined Body -->
  <path d="M48 16 C38 18, 26 28, 22 42 C36 38, 46 26, 48 16 Z" fill="url(#rocketBody)" stroke="#475569" stroke-width="0.8"/>

  <!-- Nose Cone -->
  <path d="M48 16 C45 19, 41 21, 38 22 C42 18, 45 15, 48 16 Z" fill="url(#noseCone)"/>
  <circle cx="49" cy="15" r="2" fill="#3DFF9A" filter="url(#thrustGlow)"/>

  <!-- Porthole Window with Glass Bezel -->
  <circle cx="34" cy="30" r="5" fill="#1E293B" stroke="#3DFF9A" stroke-width="1.2"/>
  <circle cx="34" cy="30" r="3.6" fill="url(#portholeGrad)"/>
  <!-- Specular glare in porthole -->
  <path d="M32 28 C33 27, 35 27, 36 28" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>

  <!-- Futuristic Trajectory Dashes & Particle Sparks -->
  <circle cx="56" cy="9" r="1.5" fill="#3DFF9A"/>
  <circle cx="61" cy="4" r="1" fill="#FFFFFF"/>
  <path d="M51 13 L58 6" stroke="#3DFF9A" stroke-width="1.5" stroke-dasharray="2 3" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
